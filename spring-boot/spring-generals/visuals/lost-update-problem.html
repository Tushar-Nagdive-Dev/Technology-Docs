<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lost Update Problem Simulator (Strict Semantic HTML)</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-main: #1e293b;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --surface: #ffffff;
            --border: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            max-width: 800px;
            margin-bottom: 2rem;
        }

        h1 {
            color: #0f172a;
        }

        main {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        /* Semantic Section Styling */
        section#simulator {
            background: var(--surface);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
        }

        section.dashboard {
            display: flex;
            justify-content: space-around;
            text-align: center;
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            margin: 0 0 20px 0;
        }

        figure.stat-box {
            background: white;
            padding: 15px 30px;
            border-radius: 8px;
            border: 2px solid var(--primary);
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        figcaption {
            font-weight: bold;
            color: #475569;
        }

        output {
            font-size: 2rem;
            color: var(--primary);
            font-family: monospace;
            font-weight: bold;
            margin-top: 5px;
        }

        nav.controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
            transform: none;
        }

        button.btn-danger {
            background-color: var(--danger);
        }

        button.btn-danger:hover {
            background-color: #dc2626;
        }

        /* Timeline / Logging Area */
        article {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            background: #1e293b;
            color: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            min-height: 300px;
        }

        section.thread-col {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        header.thread-header {
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            padding-bottom: 10px;
            border-bottom: 1px solid #475569;
            margin-bottom: 10px;
        }

        header.thread-a {
            color: #60a5fa;
        }

        header.thread-b {
            color: #f472b6;
        }

        /* <samp> is strictly semantic for computer output */
        samp.log-entry {
            display: block;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 4px;
            opacity: 0;
            animation: slideIn 0.3s forwards;
            font-size: 0.9rem;
            font-family: monospace;
        }

        samp.log-success {
            border-left: 4px solid var(--success);
        }

        samp.log-error {
            border-left: 4px solid var(--danger);
        }

        samp.log-wait {
            border-left: 4px solid var(--warning);
        }

        samp.log-read {
            border-left: 4px solid var(--primary);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        aside.explanation {
            margin-top: 20px;
            padding: 15px;
            background: #eff6ff;
            border-left: 4px solid var(--primary);
            border-radius: 0 8px 8px 0;
            display: none;
        }

        /* Utility class to hide elements semantically instead of inline CSS */
        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>

    <header>
        <h1>Concurrency Simulator</h1>
        <p>Observe what happens when User A and User B try to buy the exact same ticket at the exact same millisecond.</p>
    </header>

    <main>
        <section id="simulator">
            <section class="dashboard">
                <figure class="stat-box">
                    <figcaption>Database Inventory</figcaption>
                    <output id="db-inventory">1</output>
                </figure>

                <figure class="stat-box" id="db-version-box" hidden>
                    <figcaption>Database Version</figcaption>
                    <output id="db-version">1</output>
                </figure>

                <figure class="stat-box">
                    <figcaption>Tickets Sold</figcaption>
                    <output id="tickets-sold">0</output>
                </figure>
            </section>

            <nav class="controls">
                <button id="btn-race" class="btn-danger" onclick="runSimulation('race')">1. Simulate Race Condition (No Locks)</button>
                <button id="btn-pessimistic" onclick="runSimulation('pessimistic')">2. Pessimistic Lock (Row Lock)</button>
                <button id="btn-optimistic" onclick="runSimulation('optimistic')">3. Optimistic Lock (Version Column)</button>
                <button onclick="resetDB()" style="background: #475569;">Reset Database</button>
            </nav>

            <article id="simulation-view">
                <section class="thread-col" id="col-a">
                    <header class="thread-header thread-a">User A (Thread 1)</header>
                </section>
                <section class="thread-col" id="col-b">
                    <header class="thread-header thread-b">User B (Thread 2)</header>
                </section>
            </article>

            <aside id="explanation-box" class="explanation"></aside>
        </section>
    </main>

    <script>
        // DOM Elements
        const colA = document.getElementById('col-a');
        const colB = document.getElementById('col-b');
        const dbInvEl = document.getElementById('db-inventory');
        const soldEl = document.getElementById('tickets-sold');
        const expBox = document.getElementById('explanation-box');
        const versionBox = document.getElementById('db-version-box');
        const versionEl = document.getElementById('db-version');

        // State Variables
        let inventory = 1;
        let sold = 0;
        let version = 1;

        function resetDB() {
            inventory = 1;
            sold = 0;
            version = 1;
            dbInvEl.value = inventory;
            soldEl.value = sold;
            versionEl.value = version;

            // Semantically hide elements
            versionBox.setAttribute('hidden', '');
            expBox.style.display = 'none';
            dbInvEl.style.color = 'var(--primary)';

            // Clear logs but keep headers
            colA.innerHTML = '<header class="thread-header thread-a">User A (Thread 1)</header>';
            colB.innerHTML = '<header class="thread-header thread-b">User B (Thread 2)</header>';

            toggleButtons(false);
        }

        function toggleButtons(disabled) {
            document.querySelectorAll('nav.controls button').forEach(b => {
                if (b.innerText !== 'Reset Database') b.disabled = disabled;
            });
        }

        function logEvent(col, text, type, delay) {
            return new Promise(resolve => {
                setTimeout(() => {
                    // Strictly using the semantic <samp> tag for program output logs
                    const samp = document.createElement('samp');
                    samp.className = `log-entry ${type}`;
                    samp.innerHTML = text;
                    col.appendChild(samp);
                    resolve();
                }, delay);
            });
        }

        function updateUI(inv, s, ver = null) {
            dbInvEl.value = inv;
            soldEl.value = s;
            if (ver !== null) versionEl.value = ver;
            if (inv < 0) dbInvEl.style.color = 'var(--danger)';
        }

        async function runSimulation(type) {
            resetDB();
            toggleButtons(true);

            if (type === 'optimistic') {
                versionBox.removeAttribute('hidden');
            }

            if (type === 'race') {
                await logEvent(colA, "T=0: SELECT inventory FROM tickets;<br><em>Result: 1</em>", "log-read", 500);
                await logEvent(colB, "T=1: SELECT inventory FROM tickets;<br><em>Result: 1</em>", "log-read", 800);

                await logEvent(colA, "T=2: Calculates locally: 1 - 1 = 0", "", 800);
                await logEvent(colB, "T=3: Calculates locally: 1 - 1 = 0", "", 400);

                await logEvent(colA, "T=4: UPDATE tickets SET inventory = 0;<br><strong>COMMIT SUCCESS</strong>", "log-success", 800);
                updateUI(0, 1);

                await logEvent(colB, "T=5: UPDATE tickets SET inventory = 0;<br><strong>COMMIT SUCCESS</strong>", "log-success", 800);
                updateUI(0, 2);

                showExplanation("🚨 <strong>LOST UPDATE OCCURRED!</strong> Both users successfully bought the ticket because they both calculated their updates based on the outdated value of '1'. You sold 2 tickets, but you only had 1.");
            } else if (type === 'pessimistic') {
                await logEvent(colA, "T=0: SELECT * FROM tickets <strong>FOR UPDATE</strong>;<br><em>Result: 1 (ROW LOCKED)</em>", "log-read", 500);

                await logEvent(colB, "T=1: SELECT * FROM tickets FOR UPDATE;<br><em>Status: ⚠️ BLOCKED. Waiting for User A...</em>", "log-wait", 800);

                await logEvent(colA, "T=2: UPDATE tickets SET inventory = 0;<br><strong>COMMIT SUCCESS (Lock Released)</strong>", "log-success", 1200);
                updateUI(0, 1);

                await logEvent(colB, "T=3: Lock acquired! Reading DB...<br><em>Result: 0</em>", "log-read", 500);
                await logEvent(colB, "T=4: Checks inventory... It is 0.<br><strong>ABORT TRANSACTION</strong>", "log-error", 800);

                showExplanation("✅ <strong>PESSIMISTIC LOCKING:</strong> By using <code>SELECT FOR UPDATE</code>, the database physically locked the row. User B was forced to wait. Safe, but locks can slow down the system.");
            } else if (type === 'optimistic') {
                await logEvent(colA, "T=0: SELECT inventory, <strong>version</strong> FROM tickets;<br><em>Result: Inv=1, Ver=1</em>", "log-read", 500);
                await logEvent(colB, "T=1: SELECT inventory, <strong>version</strong> FROM tickets;<br><em>Result: Inv=1, Ver=1</em>", "log-read", 800);

                await logEvent(colA, "T=2: UPDATE tickets SET inv=0, ver=2 <strong>WHERE ver=1</strong>;<br><em>Rows affected: 1.</em> <strong>COMMIT SUCCESS</strong>", "log-success", 1000);
                updateUI(0, 1, 2);

                await logEvent(colB, "T=3: UPDATE tickets SET inv=0, ver=2 <strong>WHERE ver=1</strong>;<br><em>Rows affected: 0.</em>", "log-wait", 1000);
                await logEvent(colB, "T=4: DB Version is now 2. Update failed!<br><strong>THROWS OptimisticLockException</strong>", "log-error", 600);

                showExplanation("✅ <strong>OPTIMISTIC LOCKING:</strong> No database locks were held! The framework checks the <code>version</code> column. Because User A changed the version to 2, User B's update failed automatically.");
            }
        }

        function showExplanation(text) {
            expBox.innerHTML = text;
            expBox.style.display = 'block';
            toggleButtons(false);
        }
    </script>
</body>

</html>
