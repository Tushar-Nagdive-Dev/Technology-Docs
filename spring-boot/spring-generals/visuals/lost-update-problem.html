<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lost Update Problem Simulator</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-main: #1e293b;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --surface: #ffffff;
            --border: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            max-width: 800px;
            margin-bottom: 2rem;
        }

        h1 { color: #0f172a; }

        main {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        /* Semantic Section Styling */
        section {
            background: var(--surface);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
        }

        .dashboard {
            display: flex;
            justify-content: space-around;
            text-align: center;
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: white;
            padding: 15px 30px;
            border-radius: 8px;
            border: 2px solid var(--primary);
            font-weight: bold;
        }

        .stat-value {
            font-size: 2rem;
            color: var(--primary);
            font-family: monospace;
            display: block;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover { background-color: #2563eb; transform: translateY(-2px); }
        button:disabled { background-color: #cbd5e1; cursor: not-allowed; transform: none; }
        
        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover { background-color: #dc2626; }

        /* Timeline / Logging Area */
        article {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            background: #1e293b;
            color: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            min-height: 300px;
            font-family: monospace;
        }

        .thread-col {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .thread-header {
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            padding-bottom: 10px;
            border-bottom: 1px solid #475569;
            margin-bottom: 10px;
        }

        .thread-a { color: #60a5fa; }
        .thread-b { color: #f472b6; }

        .log-entry {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 4px;
            opacity: 0;
            animation: slideIn 0.3s forwards;
            font-size: 0.9rem;
        }

        .log-success { border-left: 4px solid var(--success); }
        .log-error { border-left: 4px solid var(--danger); }
        .log-wait { border-left: 4px solid var(--warning); }
        .log-read { border-left: 4px solid var(--primary); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .explanation {
            margin-top: 20px;
            padding: 15px;
            background: #eff6ff;
            border-left: 4px solid var(--primary);
            border-radius: 0 8px 8px 0;
            display: none;
        }

    </style>
</head>
<body>

    <header>
        <h1>Concurrency Simulator</h1>
        <p>Observe what happens when User A and User B try to buy the exact same ticket at the exact same millisecond.</p>
    </header>

    <main>
        <section>
            <div class="dashboard">
                <div class="stat-box">
                    <span class="stat-label">Database Inventory</span>
                    <span class="stat-value" id="db-inventory">1</span>
                </div>
                <div class="stat-box" id="db-version-box" style="display: none;">
                    <span class="stat-label">Database Version</span>
                    <span class="stat-value" id="db-version">1</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Tickets Sold</span>
                    <span class="stat-value" id="tickets-sold">0</span>
                </div>
            </div>

            <nav class="controls">
                <button id="btn-race" class="btn-danger" onclick="runSimulation('race')">1. Simulate Race Condition (No Locks)</button>
                <button id="btn-pessimistic" onclick="runSimulation('pessimistic')">2. Pessimistic Lock (Row Lock)</button>
                <button id="btn-optimistic" onclick="runSimulation('optimistic')">3. Optimistic Lock (Version Column)</button>
                <button onclick="resetDB()" style="background: #475569;">Reset Database</button>
            </nav>

            <article id="simulation-view">
                <div class="thread-col" id="col-a">
                    <div class="thread-header thread-a">User A (Thread 1)</div>
                </div>
                <div class="thread-col" id="col-b">
                    <div class="thread-header thread-b">User B (Thread 2)</div>
                </div>
            </article>

            <aside id="explanation-box" class="explanation"></aside>
        </section>
    </main>

    <script>
        // DOM Elements
        const colA = document.getElementById('col-a');
        const colB = document.getElementById('col-b');
        const dbInvEl = document.getElementById('db-inventory');
        const soldEl = document.getElementById('tickets-sold');
        const expBox = document.getElementById('explanation-box');
        const versionBox = document.getElementById('db-version-box');
        const versionEl = document.getElementById('db-version');

        // State Variables
        let inventory = 1;
        let sold = 0;
        let version = 1;

        function resetDB() {
            inventory = 1;
            sold = 0;
            version = 1;
            dbInvEl.innerText = inventory;
            soldEl.innerText = sold;
            versionEl.innerText = version;
            versionBox.style.display = 'none';
            expBox.style.display = 'none';
            dbInvEl.style.color = 'var(--primary)';
            
            // Clear logs but keep headers
            colA.innerHTML = '<div class="thread-header thread-a">User A (Thread 1)</div>';
            colB.innerHTML = '<div class="thread-header thread-b">User B (Thread 2)</div>';
            
            toggleButtons(false);
        }

        function toggleButtons(disabled) {
            document.querySelectorAll('.controls button').forEach(b => {
                if(b.innerText !== 'Reset Database') b.disabled = disabled;
            });
        }

        function logEvent(col, text, type, delay) {
            return new Promise(resolve => {
                setTimeout(() => {
                    const div = document.createElement('div');
                    div.className = `log-entry ${type}`;
                    div.innerHTML = text;
                    col.appendChild(div);
                    resolve();
                }, delay);
            });
        }

        function updateUI(inv, s, ver = null) {
            dbInvEl.innerText = inv;
            soldEl.innerText = s;
            if(ver !== null) versionEl.innerText = ver;
            if(inv < 0) dbInvEl.style.color = 'var(--danger)'; // Highlight negative inventory
        }

        async function runSimulation(type) {
            resetDB();
            toggleButtons(true);

            if(type === 'optimistic') {
                versionBox.style.display = 'block';
            }

            if(type === 'race') {
                // The Lost Update Sequence
                await logEvent(colA, "T=0: SELECT inventory FROM tickets;<br><i>Result: 1</i>", "log-read", 500);
                await logEvent(colB, "T=1: SELECT inventory FROM tickets;<br><i>Result: 1</i>", "log-read", 800);
                
                await logEvent(colA, "T=2: Calculates locally: 1 - 1 = 0", "", 800);
                await logEvent(colB, "T=3: Calculates locally: 1 - 1 = 0", "", 400);

                await logEvent(colA, "T=4: UPDATE tickets SET inventory = 0;<br><b>COMMIT SUCCESS</b>", "log-success", 800);
                updateUI(0, 1);
                
                await logEvent(colB, "T=5: UPDATE tickets SET inventory = 0;<br><b>COMMIT SUCCESS</b>", "log-success", 800);
                updateUI(0, 2);

                showExplanation("🚨 <b>LOST UPDATE OCCURRED!</b> Both users successfully bought the ticket because they both calculated their updates based on the outdated value of '1'. You sold 2 tickets, but you only had 1. Your database is now corrupted relative to real-world constraints.");
            } 
            else if (type === 'pessimistic') {
                // Pessimistic Lock (SELECT FOR UPDATE)
                await logEvent(colA, "T=0: SELECT * FROM tickets <b>FOR UPDATE</b>;<br><i>Result: 1 (ROW LOCKED)</i>", "log-read", 500);
                
                await logEvent(colB, "T=1: SELECT * FROM tickets FOR UPDATE;<br><i>Status: ⚠️ BLOCKED. Waiting for User A to release lock...</i>", "log-wait", 800);
                
                await logEvent(colA, "T=2: UPDATE tickets SET inventory = 0;<br><b>COMMIT SUCCESS (Lock Released)</b>", "log-success", 1200);
                updateUI(0, 1);

                await logEvent(colB, "T=3: Lock acquired! Reading DB...<br><i>Result: 0</i>", "log-read", 500);
                await logEvent(colB, "T=4: Checks inventory... It is 0.<br><b>ABORT TRANSACTION</b> (Item Sold Out)", "log-error", 800);

                showExplanation("✅ <b>PESSIMISTIC LOCKING:</b> By using <code>SELECT FOR UPDATE</code>, the database physically locked the row. User B was forced to wait until User A finished. When User B finally got to read the row, the inventory was correctly shown as 0. Safe, but locks can slow down the system under heavy traffic.");
            }
            else if (type === 'optimistic') {
                // Optimistic Lock (@Version)
                await logEvent(colA, "T=0: SELECT inventory, <b>version</b> FROM tickets;<br><i>Result: Inv=1, Ver=1</i>", "log-read", 500);
                await logEvent(colB, "T=1: SELECT inventory, <b>version</b> FROM tickets;<br><i>Result: Inv=1, Ver=1</i>", "log-read", 800);
                
                await logEvent(colA, "T=2: UPDATE tickets SET inv=0, ver=2 <b>WHERE ver=1</b>;<br><i>Rows affected: 1.</i> <b>COMMIT SUCCESS</b>", "log-success", 1000);
                updateUI(0, 1, 2);

                await logEvent(colB, "T=3: UPDATE tickets SET inv=0, ver=2 <b>WHERE ver=1</b>;<br><i>Rows affected: 0.</i>", "log-wait", 1000);
                await logEvent(colB, "T=4: DB Version is now 2. Update failed!<br><b>THROWS OptimisticLockException</b>", "log-error", 600);

                showExplanation("✅ <b>OPTIMISTIC LOCKING:</b> No database locks were held! Instead, we check the <code>version</code> column during the UPDATE. Because User A changed the version to 2, User B's <code>WHERE version=1</code> clause affected 0 rows. The framework detects this and throws an error. Excellent for high-read, low-write performance.");
            }
        }

        function showExplanation(text) {
            expBox.innerHTML = text;
            expBox.style.display = 'block';
            toggleButtons(false);
        }
    </script>
</body>
</html>
