<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Log Architecture Simulator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; padding: 20px; max-width: 600px; margin: 0 auto; color: #333; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid #ddd; }
        .control-group { margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="range"] { width: 100%; }
        select { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
        .results { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 6px; border-left: 4px solid #007bff; }
        .metric { font-size: 1.1em; margin: 10px 0; }
        .high { color: #dc3545; font-weight: bold; }
        .med { color: #ffc107; font-weight: bold; }
        .low { color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>AWS Log Storage Simulator</h2>
        <p>Adjust the parameters below to see how they impact your data warehouse architecture.</p>

        <div class="control-group">
            <label for="volume">Daily Log Volume: <span id="volume-val">100</span> GB</label>
            <input type="range" id="volume" min="10" max="10000" step="10" value="100">
        </div>

        <div class="control-group">
            <label for="ingestion">Ingestion Method</label>
            <select id="ingestion">
                <option value="batch">Batch / Direct to S3 (Cheaper, Slower)</option>
                <option value="stream" selected>Stream / Kinesis (Real-time, Expensive)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="retention">Redshift 'Hot' Storage: <span id="retention-val">30</span> Days</label>
            <input type="range" id="retention" min="1" max="365" value="30">
        </div>

        <div class="results" id="results-pane">
            <h3>Architecture Assessment</h3>
            <div class="metric">Estimated Cost: <span id="cost-output" class="med">Medium</span></div>
            <div class="metric">Query Latency: <span id="latency-output" class="low">Low (Fast)</span></div>
            <p id="summary-text" style="font-size: 0.9em; color: #555;">This setup is balanced for standard real-time troubleshooting.</p>
        </div>
    </div>

    <script>
        const volumeInput = document.getElementById('volume');
        const ingestionInput = document.getElementById('ingestion');
        const retentionInput = document.getElementById('retention');
        
        const volumeVal = document.getElementById('volume-val');
        const retentionVal = document.getElementById('retention-val');
        
        const costOutput = document.getElementById('cost-output');
        const latencyOutput = document.getElementById('latency-output');
        const summaryText = document.getElementById('summary-text');

        function updateSimulation() {
            const vol = parseInt(volumeInput.value);
            const retention = parseInt(retentionInput.value);
            const isStream = ingestionInput.value === 'stream';

            volumeVal.innerText = vol;
            retentionVal.innerText = retention;

            // Simple logic to determine cost
            let costScore = (vol * 0.1) + (retention * 2) + (isStream ? 50 : 0);
            if (costScore > 600) {
                costOutput.innerHTML = '<span class="high">High</span>';
            } else if (costScore > 200) {
                costOutput.innerHTML = '<span class="med">Medium</span>';
            } else {
                costOutput.innerHTML = '<span class="low">Low</span>';
            }

            // Logic for latency
            if (isStream && retention > 14) {
                latencyOutput.innerHTML = '<span class="low">Low (Fast)</span>';
                summaryText.innerText = "Optimized for real-time debugging with fast queries on recent data.";
            } else if (!isStream) {
                latencyOutput.innerHTML = '<span class="med">Medium (Batch Delay)</span>';
                summaryText.innerText = "Highly cost-optimized. Data takes longer to become queryable.";
            } else {
                latencyOutput.innerHTML = '<span class="med">Medium</span>';
                summaryText.innerText = "A balanced approach leaning towards real-time ingestion but offloading storage.";
            }
        }

        volumeInput.addEventListener('input', updateSimulation);
        ingestionInput.addEventListener('change', updateSimulation);
        retentionInput.addEventListener('input', updateSimulation);

        // Initial run
        updateSimulation();
    </script>
</body>
</html>
